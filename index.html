<!doctype html>
<html lang="{{SITE_LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta name="author" content="{{SITE_AUTHOR}}" />
    <meta name="theme-color" content="{{SITE_THEME_COLOR}}" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />

    <!--
      index.html 是模板：花括号占位符由 vite.config.ts 从 src/data/siteMeta.ts 填充。
      不要在页面里写死姓名 / 地址 / 简介，避免与数据文件不一致。
    -->

    <!-- 分享卡片：微信 / 飞书 / 社交平台转发时的标题与简介 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{SITE_LOCALE}}" />
    <meta property="og:site_name" content="{{SITE_TITLE}}" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <!-- 分享大图建议放一张 1200×630 的简历截图，抓取器普遍不认 AVIF -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />

    <!-- 字体完全离线：见 src/fonts.css（由 pnpm fonts:fetch 生成），不依赖任何 CDN -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
